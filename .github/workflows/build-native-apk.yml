name: Build Native DSH APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DSH-app
        uses: actions/checkout@v4
        with:
          path: 'dsh-app'

      - name: Checkout DSH-go-rewrite
        uses: actions/checkout@v4
        with:
          repository: 'patelakash007/DSH-go-rewrite'
          path: 'dsh-go-rewrite'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'

      - name: Test Go Engine
        working-directory: dsh-go-rewrite
        run: go test ./...

      - name: Test Dart Client Against Go Engine
        shell: bash
        run: |
          set -euo pipefail
          host="$RUNNER_TEMP/dsh-server"
          home="$RUNNER_TEMP/dsh-native-contract-home"
          log="$RUNNER_TEMP/dsh-native-contract.log"
          (cd dsh-go-rewrite && go build -o "$host" ./cmd/dsh-server)
          mkdir -p "$home"
          "$host" --port 39080 --home "$home" >"$log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do
            launch_url=$(sed -nE 's/^dsh web: (http.*)$/\1/p' "$log" | tail -n 1)
            if [ -n "$launch_url" ]; then break; fi
            if ! kill -0 "$pid" 2>/dev/null; then cat "$log"; exit 1; fi
            sleep 0.1
          done
          test -n "${launch_url:-}" || { cat "$log"; exit 1; }
          (cd dsh-app/packages/dsh_client && dart pub get --enforce-lockfile)
          (cd dsh-app/packages/dsh_client && DSH_NATIVE_GO_LIVE_URL="$launch_url" dart test test/native_go_contract_test.dart --reporter expanded)

      - name: Compile Native Go Engine for Android ARM64
        run: |
          mkdir -p dsh-app/app/android/app/src/main/jniLibs/arm64-v8a
          cd dsh-go-rewrite
          CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -ldflags="-s -w" -o ../dsh-app/app/android/app/src/main/jniLibs/arm64-v8a/libdsh.so ./cmd/dsh-server

      - name: Verify Android Native Engine
        run: |
          file dsh-app/app/android/app/src/main/jniLibs/arm64-v8a/libdsh.so | grep -q 'ARM aarch64'
          readelf -lW dsh-app/app/android/app/src/main/jniLibs/arm64-v8a/libdsh.so | grep -q '/system/bin/linker64'
          test "$(readelf -lW dsh-app/app/android/app/src/main/jniLibs/arm64-v8a/libdsh.so | awk '$1 == "LOAD" {print $NF}' | sort -u)" = '0x10000'

      - name: Build Flutter Release APK
        run: |
          cd dsh-app/app
          flutter pub get
          flutter build apk --release --flavor arm64

      - name: Upload APK to Artifacts / Releases
        uses: actions/upload-artifact@v4
        with:
          name: dsh-native-release.apk
          path: dsh-app/app/build/app/outputs/flutter-apk/*.apk
